name: gallery_cleaner
description: A simple photo cleaning app with swipe UI and hourly notifications.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  photo_manager: ^3.0.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2
  swipe_cards: ^2.0.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
